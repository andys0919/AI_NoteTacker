services:
  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_CONSOLE_USERNAME: ${ADMIN_CONSOLE_USERNAME:-admin}
      ADMIN_CONSOLE_PASSWORD: ${ADMIN_CONSOLE_PASSWORD:?Set ADMIN_CONSOLE_PASSWORD to a dedicated secret of at least 6 bytes}
      ADMIN_CONSOLE_SESSION_SECRET: ${ADMIN_CONSOLE_SESSION_SECRET:-}
      ADMIN_CONSOLE_SESSION_TTL_HOURS: ${ADMIN_CONSOLE_SESSION_TTL_HOURS:-12}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_SPEECH_MAI_API_KEY: ${AZURE_SPEECH_MAI_API_KEY:-}
      AZURE_SPEECH_MAI_ENDPOINT: ${AZURE_SPEECH_MAI_ENDPOINT:-}
      AZURE_SPEECH_MAI_MODEL: ${AZURE_SPEECH_MAI_MODEL:-mai-transcribe-1.5}
      AI_PRICING_VERSION: ${AI_PRICING_VERSION:-v1}
      CLOUD_QUOTA_TIMEZONE: ${CLOUD_QUOTA_TIMEZONE:-UTC}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for PostgreSQL persistence}
      DEFAULT_DAILY_CLOUD_QUOTA_USD: ${DEFAULT_DAILY_CLOUD_QUOTA_USD:-5}
      DEFAULT_TRANSCRIPTION_PROVIDER: ${DEFAULT_TRANSCRIPTION_PROVIDER:-azure-speech-mai-transcribe-1.5}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-cloud}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN to a dedicated secret of at least 32 bytes}
      LIVE_MEETING_RESERVATION_CAP_USD: ${LIVE_MEETING_RESERVATION_CAP_USD:-1.5}
      MAX_CONCURRENT_TRANSCRIPTION_JOBS: ${MAX_CONCURRENT_TRANSCRIPTION_JOBS:-1}
      MAX_MEETING_JOB_BACKLOG: ${MAX_MEETING_JOB_BACKLOG:-2}
      MAX_TRANSCRIPTION_JOB_BACKLOG: ${MAX_TRANSCRIPTION_JOB_BACKLOG:-10}
      MEETING_BOT_BASE_URL: ${MEETING_BOT_BASE_URL:-http://meeting-bot:3000}
      MEETING_SHARE_SECRET: ${MEETING_SHARE_SECRET:-}
      MEETING_BOT_CONTROL_BASE_URL: ${MEETING_BOT_CONTROL_BASE_URL:-http://meeting-bot:3001}
      MEETING_BOT_CONTROL_TOKEN: ${MEETING_BOT_CONTROL_TOKEN:-}
      PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-postgres}
      PORT: ${PORT:-3000}
      QWEN_ASR_ENDPOINT: ${QWEN_ASR_ENDPOINT:-}
      QWEN_ASR_MODEL: ${QWEN_ASR_MODEL:-qwen3-asr-1.7b}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-meeting-artifacts}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-5.6-luna}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      TZ: ${TZ:-Asia/Taipei}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  recording-worker:
    build:
      context: .
      dockerfile: workers/recording-worker/Dockerfile
    restart: unless-stopped
    environment:
      ARTIFACT_BASE_URL: ${ARTIFACT_BASE_URL:-http://minio:9000/meeting-artifacts}
      CONTROL_PLANE_BASE_URL: ${CONTROL_PLANE_BASE_URL:-http://control-plane:3000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN to a dedicated secret of at least 32 bytes}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1000}
      WORKER_ID: worker-alpha
    depends_on:
      control-plane:
        condition: service_healthy

  transcription-worker:
    build:
      context: .
      dockerfile: workers/transcription-worker/Dockerfile
      target: transcription
    restart: unless-stopped
    environment:
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_TRANSCRIBE_LANGUAGE: ${AZURE_OPENAI_TRANSCRIBE_LANGUAGE:-}
      AZURE_OPENAI_TRANSCRIBE_PROMPT: ${AZURE_OPENAI_TRANSCRIBE_PROMPT:-}
      AZURE_OPENAI_TRANSCRIBE_TIMEOUT_SECONDS: ${AZURE_OPENAI_TRANSCRIBE_TIMEOUT_SECONDS:-300}
      AZURE_SPEECH_MAI_API_KEY: ${AZURE_SPEECH_MAI_API_KEY:-}
      AZURE_SPEECH_MAI_API_VERSION: ${AZURE_SPEECH_MAI_API_VERSION:-2025-10-15}
      AZURE_SPEECH_MAI_ENDPOINT: ${AZURE_SPEECH_MAI_ENDPOINT:-}
      AZURE_SPEECH_MAI_MODEL: ${AZURE_SPEECH_MAI_MODEL:-mai-transcribe-1.5}
      AZURE_SPEECH_MAI_TIMEOUT_SECONDS: ${AZURE_SPEECH_MAI_TIMEOUT_SECONDS:-300}
      CONTROL_PLANE_BASE_URL: ${CONTROL_PLANE_BASE_URL:-http://control-plane:3000}
      CONTROL_PLANE_TIMEOUT_SECONDS: ${CONTROL_PLANE_TIMEOUT_SECONDS:-30}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-cloud}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN to a dedicated secret of at least 32 bytes}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1000}
      QWEN_ASR_ENDPOINT: ${QWEN_ASR_ENDPOINT:-}
      QWEN_ASR_MODEL: ${QWEN_ASR_MODEL:-qwen3-asr-1.7b}
      QWEN_ASR_TIMEOUT_SECONDS: ${QWEN_ASR_TIMEOUT_SECONDS:-300}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WORKER_ID: transcriber-alpha
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    volumes:
      - whisper_model_cache:/root/.cache/huggingface
    depends_on:
      control-plane:
        condition: service_healthy

  qwen3-asr:
    profiles: ["qwen"]
    image: qwenllm/qwen3-asr@sha256:fb75b775f089e06e5a1aaebffd421e37505cc630d50c86d889d95ffa45a7e16a
    restart: unless-stopped
    entrypoint: ["qwen-asr-serve"]
    command:
      - Qwen/Qwen3-ASR-1.7B
      - --served-model-name
      - qwen3-asr-1.7b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.40"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      - --enforce-eager
    gpus: all
    volumes:
      - qwen3_asr_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  codex-pty-agent:
    build:
      context: ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}
      dockerfile: Dockerfile.live-shared
    image: ai-notetacker-codex-pty-agent:managed
    restart: unless-stopped
    init: true
    user: "bun"
    stop_grace_period: 20s
    command: ["bun", "run", "/app/codex-pty-agent.ts"]
    environment:
      AGENT_PROVIDER: codex-pty
      ALLOWED_PATHS: "*"
      API_PROMPT_TOKEN: ${CODEX_PTY_API_TOKEN:?Set CODEX_PTY_API_TOKEN to a dedicated secret of at least 32 bytes}
      AUTOPILOT_DEFAULT: "true"
      CLAUDE_WORKING_DIR: /workspace/codex-pty-workdir
      CODEX_HOME: /home/bun/.codex
      CODEX_MODEL: gpt-5.6-luna
      HOME: /home/bun
      IS_SANDBOX: "1"
      MEMORY_FEATURES_ENABLED: "false"
      PROMPT_API_MAX_BODY_BYTES: "1048576"
      PROVIDER_FAILOVER_ENABLED: "false"
      PTY_DAEMON_NAMESPACE: ai-notetacker-codex-pty
      PTY_FRESH_SESSION_PER_TURN: "true"
      SESSION_DIR: /home/bun/.local/state/claude-telegram-bot/sessions
      USER_PROFILING_ENABLED: "false"
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: "3001"
    volumes:
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/src:/app/src:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/packages:/app/packages:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/vendor:/app/vendor:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/scripts:/app/scripts:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/mcp-shared:/app/mcp-shared:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/ask_user_mcp:/app/ask_user_mcp:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/send_file_mcp:/app/send_file_mcp:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/bash_progress_mcp:/app/bash_progress_mcp:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/config:/app/config:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/mcp-config.ts:/app/mcp-config.ts:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/package.json:/app/package.json:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/bun.lock:/app/bun.lock:ro
      - ${CLAUDE_TELEGRAM_SOURCE_DIR:-/home/solomon/docker-managed/sources/shared/claude-telegram-bot}/tsconfig.json:/app/tsconfig.json:ro
      - ./codex-pty-agent.ts:/app/codex-pty-agent.ts:ro
      - ./.codex-pty-workdir:/workspace/codex-pty-workdir
      - codex_pty_agent_home:/home/bun/.codex
      - codex_pty_agent_state:/home/bun/.local/state
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  summary-worker:
    build:
      context: .
      dockerfile: workers/transcription-worker/Dockerfile
      target: summary
    restart: unless-stopped
    command: ["python", "-m", "transcription_worker.summary_main"]
    environment:
      # Keep fallback code/config available, but do not enable it in production.
      AZURE_OPENAI_SUMMARY_API_KEY: ""
      AZURE_OPENAI_SUMMARY_ENDPOINT: ""
      AZURE_OPENAI_SUMMARY_TIMEOUT_SECONDS: ${AZURE_OPENAI_SUMMARY_TIMEOUT_SECONDS:-900}
      CODEX_CLI_PATH: ${CODEX_CLI_PATH:-codex}
      CODEX_PTY_API_TOKEN: ${CODEX_PTY_API_TOKEN:?Set CODEX_PTY_API_TOKEN to a dedicated secret of at least 32 bytes}
      CODEX_PTY_API_URL: http://codex-pty-agent:3001/api/prompt
      CONTROL_PLANE_BASE_URL: ${CONTROL_PLANE_BASE_URL:-http://control-plane:3000}
      CONTROL_PLANE_TIMEOUT_SECONDS: ${CONTROL_PLANE_TIMEOUT_SECONDS:-30}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN to a dedicated secret of at least 32 bytes}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1000}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-5.6-luna}
      SUMMARY_REASONING_EFFORT: ${SUMMARY_REASONING_EFFORT:-max}
      SUMMARY_TIMEOUT_SECONDS: ${SUMMARY_TIMEOUT_SECONDS:-900}
      WORKER_ID: summarizer-alpha
      CODEX_HOME: /codex-home
    volumes:
      - summary_codex_home:/codex-home
    depends_on:
      codex-pty-agent:
        condition: service_healthy
      control-plane:
        condition: service_healthy

  postgres:
    image: postgres@sha256:2586e2a95d1c9b31cb2967feb562948f7d364854453d703039b6efa45fe48417
    restart: unless-stopped
    environment:
      POSTGRES_DB: ainotetacker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a dedicated secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ainotetacker"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER to a dedicated value}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to a dedicated secret}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  summary_codex_home:
    external: true
    name: ai_notetacker_summary_codex_home
  codex_pty_agent_home:
    external: true
    name: ai_notetacker_codex_pty_home
  codex_pty_agent_state:
  qwen3_asr_cache:
    name: qwen3-asr-cache
  whisper_model_cache:
