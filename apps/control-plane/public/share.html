<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>共享會議紀錄</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="modulepreload" href="/share.js" />
    <link rel="modulepreload" href="/artifact-reader.js" />
    <link rel="modulepreload" href="/escape-html.js" />
  </head>
  <body class="shared-meeting-page">
    <a class="skip-link" href="#shared-meeting-content">跳至會議內容</a>
    <main id="shared-meeting-content" class="shared-meeting-shell" tabindex="-1" hidden>
      <header class="shared-meeting-header">
        <div class="shared-meeting-heading">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 10v4" />
              <path d="M8 6v12" />
              <path d="M12 3v18" />
              <path d="M16 6v12" />
              <path d="M20 10v4" />
            </svg>
          </span>
          <div>
            <p class="brand-name">Solomon NoteTaker · 共享文件</p>
            <h1 id="shared-title">會議紀錄</h1>
            <p id="shared-meta" class="shared-meeting-meta"></p>
          </div>
        </div>
        <button id="print-shared-meeting" class="mini-button export" type="button">列印</button>
        <button id="copy-shared-meeting" class="mini-button export share-publish-button" type="button" hidden aria-label="複製分享網址" title="複製分享網址">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8.6 13.5 6.8 3.9M15.4 6.6 8.6 10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>複製分享網址</span>
        </button>
      </header>
      <p id="shared-notice" class="shared-meeting-notice" role="status" aria-live="polite" hidden></p>
      <section id="shared-reader" class="shared-meeting-section shared-reader" hidden></section>
    </main>
    <main id="shared-meeting-status" class="shared-meeting-status" role="status" aria-live="polite" hidden>
      正在載入共享會議紀錄…
    </main>
    <noscript>
      <main class="shared-meeting-status">
        此頁需要啟用 JavaScript 才能安全讀取共享會議紀錄。
      </main>
    </noscript>
    <script type="module" src="/share.js"></script>
  </body>
</html>
