<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solomon NoteTaker Console</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="modulepreload" href="/app.js" />
    <link rel="modulepreload" href="/escape-html.js" />
    <link rel="modulepreload" href="/dashboard-copy.js" />
    <link rel="modulepreload" href="/dashboard-query.js" />
    <link rel="modulepreload" href="/dashboard-workflows.js" />
    <link rel="modulepreload" href="/artifact-reader.js" />
    <link rel="modulepreload" href="/currency-display.js" />
  </head>
  <body>
    <a class="skip-link" href="#dashboard-content">跳至主要內容</a>
    <main id="dashboard-content" class="shell">
      <header class="dashboard-topbar" aria-labelledby="dashboard-title">
        <div class="dashboard-topbar-copy">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 10v4" />
              <path d="M8 6v12" />
              <path d="M12 3v18" />
              <path d="M16 6v12" />
              <path d="M20 10v4" />
            </svg>
          </span>
          <div>
            <p class="brand-name">Solomon NoteTaker</p>
            <h1 id="dashboard-title">會議筆記工作台</h1>
            <p class="dashboard-topbar-text">加入會議或上傳錄音，集中查看摘要與逐字稿。</p>
          </div>
        </div>
        <div class="dashboard-topbar-actions">
          <a id="admin-entry-link" class="dashboard-admin-link" href="/admin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.16.38.37.72.6 1 .3.34.68.55 1.1.6h.1v4h-.1a1.7 1.7 0 0 0-1.7.4Z" />
            </svg>
            <span>管理設定</span>
          </a>
        </div>
      </header>

      <section class="dashboard-grid">
        <div class="dashboard-right-stage">
          <section class="panel queue-panel">
            <div class="section-heading queue-header">
              <div>
                <p class="panel-eyebrow">知識庫</p>
                <h2>會議筆記</h2>
                <p class="section-copy queue-copy">查看處理進度；完整內容會在新分頁開啟。</p>
              </div>
              <div id="archive-controls" class="queue-side" hidden>
                <label class="queue-search">
                  <span>搜尋紀錄</span>
                  <input
                    id="archive-search"
                    name="archiveSearch"
                    type="search"
                    autocomplete="off"
                    aria-controls="job-list"
                    placeholder="會議名稱、連結、逐字稿、摘要"
                  />
                </label>
                <div class="queue-stats">
                  <span class="stat-pill"><strong id="active-count">0</strong> 進行中</span>
                  <span class="stat-pill"><strong id="queued-count">0</strong> 等待中</span>
                  <span class="stat-pill"><strong id="completed-count">0</strong> 已完成</span>
                </div>
                <button
                  id="clear-history-button"
                  class="toolbar-button danger"
                  type="button"
                  disabled
                  hidden
                >
                  清除已完成紀錄
                </button>
              </div>
            </div>
            <div
              id="status-banner"
              class="status-banner"
              role="status"
              aria-live="polite"
              aria-atomic="true"
              hidden
            ></div>
            <div id="job-filters" class="job-filters" role="group" aria-label="工作篩選" hidden>
              <button
                class="filter-chip active"
                data-filter="all"
                type="button"
                aria-pressed="true"
                aria-controls="job-list"
              >
                全部
              </button>
              <button
                class="filter-chip"
                data-filter="active"
                type="button"
                aria-pressed="false"
                aria-controls="job-list"
              >
                進行中
              </button>
              <button
                class="filter-chip"
                data-filter="completed"
                type="button"
                aria-pressed="false"
                aria-controls="job-list"
              >
                已完成
              </button>
              <button
                class="filter-chip"
                data-filter="failed"
                type="button"
                aria-pressed="false"
                aria-controls="job-list"
              >
                失敗
              </button>
              <button
                class="filter-chip"
                data-filter="recent"
                type="button"
                aria-pressed="false"
                aria-controls="job-list"
              >
                最近 7 天
              </button>
            </div>
            <div id="job-list" class="job-list" aria-busy="true">
              <div class="empty-state">
                <p>正在載入會議筆記…</p>
              </div>
            </div>
          </section>
        </div>

        <div class="dashboard-left-rail">
          <section class="panel form-panel intake-panel">
            <div class="section-heading">
              <span class="section-heading-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 10l4.6-2.3a1 1 0 0 1 1.4.9v6.8a1 1 0 0 1-1.4.9L15 14" />
                  <rect x="3" y="6" width="12" height="12" rx="3" />
                </svg>
              </span>
              <div class="section-heading-text">
                <p class="panel-eyebrow">即時會議</p>
                <h2>加入線上會議</h2>
              </div>
            </div>
            <p class="section-copy">支援 Google Meet、Microsoft Teams 與 Zoom 連結。</p>
            <form id="meeting-form" class="stack-form" aria-busy="false">
              <label class="field">
                <span>會議連結</span>
                <input
                  id="meeting-url"
                  name="meetingUrl"
                  type="url"
                  placeholder="https://teams.live.com/meet/..."
                  required
                />
              </label>
              <label class="field">
                <span>入會顯示名稱</span>
                <input
                  id="join-name"
                  name="requestedJoinName"
                  type="text"
                  placeholder="Solomon - NoteTaker"
                />
              </label>
              <label class="field">
                <span>會議密碼（選填）</span>
                <input
                  id="meeting-passcode"
                  name="meetingPasscode"
                  type="text"
                  autocomplete="off"
                  placeholder="Zoom 會議若設有密碼請填入"
                />
              </label>
              <button id="meeting-submit-button" class="action-button" type="submit">
                開始整理會議
              </button>
              <p
                id="meeting-form-status"
                class="form-status"
                role="status"
                aria-live="polite"
                hidden
              ></p>
            </form>
          </section>

          <section class="panel form-panel intake-panel">
            <div class="section-heading">
              <span class="section-heading-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 16V4" />
                  <path d="m7 9 5-5 5 5" />
                  <path d="M20 15v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4" />
                </svg>
              </span>
              <div class="section-heading-text">
                <p class="panel-eyebrow">錄音檔案</p>
                <h2>上傳錄音</h2>
              </div>
            </div>
            <p class="section-copy">適合會後補件或既有錄音整理，支援音訊與影片格式。</p>
            <form id="upload-form" class="stack-form" aria-busy="false">
              <label class="upload-dropzone" for="audio-file">
                <input id="audio-file" name="audio" type="file" accept="audio/*,video/*" required />
                <span id="upload-title" class="upload-title">拖曳檔案到這裡，或點擊選擇</span>
                <span id="upload-subtitle" class="upload-subtitle">送出後會自動產生逐字稿與摘要。</span>
              </label>
              <button id="upload-submit-button" class="action-button secondary" type="submit">
                上傳並開始整理
              </button>
              <p
                id="upload-form-status"
                class="form-status"
                role="status"
                aria-live="polite"
                hidden
              ></p>
            </form>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
